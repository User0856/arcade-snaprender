[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcade_snaprender"
version = "0.1.0"
description = "Arcade.dev tools for SnapRender: screenshots, PDFs and page-to-markdown for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["arcade", "mcp", "screenshot", "pdf", "markdown", "web-scraping", "ai-agents", "snaprender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "arcade-mcp-server>=1.33.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[[project.authors]]
name = "SnapRender"
email = "support@snap-render.com"

[project.urls]
Homepage = "https://snap-render.com"
Documentation = "https://snap-render.com/docs"
Repository = "https://github.com/User0856/arcade-snaprender"
Issues = "https://github.com/User0856/arcade-snaprender/issues"

[project.scripts]
arcade-snaprender = "arcade_snaprender.__main__:main"

# Tell Arcade that this package has Arcade tools
[project.entry-points.arcade_toolkits]
toolkit_name = "arcade_snaprender"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "mypy>=1.5.1",
    "ruff>=0.6.0",
]

[tool.mypy]
files = ["arcade_snaprender/**/*.py"]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.hatch.build.targets.wheel]
packages = ["arcade_snaprender"]

[tool.hatch.build.targets.sdist]
include = ["arcade_snaprender", "tests", "README.md", "LICENSE", "pyproject.toml"]
